<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8fa" />
    <meta name="description" content="暮らしから、ずっと一緒を考える。保護ペット相性診断 Petton。" />
    <title>Petton｜暮らしから出会う保護ペット</title>
    <link rel="icon" type="image/png" href="./assets/petton-app-icon.png" />
    <link rel="apple-touch-icon" href="./assets/petton-app-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" />
    <style>
:root {
  --paper: #fffdfd;
  --canvas: #fff8fa;
  --blush: #fdeef3;
  --blush-strong: #ffdbe6;
  --pink: #ff7da3;
  --pink-deep: #f45082;
  --pink-dark: #cd3567;
  --ink: #382f3c;
  --muted: #817985;
  --line: #f0e4e9;
  --mint: #5ac595;
  --blue: #68bdf4;
  --lavender: #9d86e9;
  --amber: #f6ab48;
  --shadow: 0 20px 60px rgba(101, 52, 72, .14);
  --soft-shadow: 0 10px 28px rgba(112, 69, 85, .09);
  --radius: 26px;
}

* { box-sizing: border-box; }

html { background: #f8eef2; }

body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  min-height: 100svh;
  color: var(--ink);
  background:
    radial-gradient(circle at 20% 10%, rgba(255, 175, 199, .55), transparent 26rem),
    radial-gradient(circle at 86% 80%, rgba(166, 219, 255, .38), transparent 30rem),
    #f8eef2;
  font-family: "M PLUS Rounded 1c", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

button, input { font: inherit; }

button { -webkit-tap-highlight-color: transparent; }

.ambient {
  position: fixed;
  width: 14rem;
  height: 14rem;
  border-radius: 50%;
  filter: blur(10px);
  opacity: .45;
  pointer-events: none;
}

.ambient-one { top: 12%; left: 8%; background: #ffd7e3; }
.ambient-two { right: 6%; bottom: 8%; background: #dcecff; }

.app-shell {
  position: relative;
  width: min(100%, 448px);
  min-height: 100vh;
  min-height: 100svh;
  margin: 0 auto;
  overflow: hidden;
  background: var(--canvas);
  box-shadow: var(--shadow);
}

.app-header {
  position: sticky;
  z-index: 20;
  top: 0;
  display: grid;
  grid-template-columns: 44px 1fr auto;
  align-items: center;
  gap: 8px;
  min-height: 66px;
  padding: max(10px, env(safe-area-inset-top)) 18px 8px;
  background: rgba(255, 248, 250, .9);
  border-bottom: 1px solid rgba(240, 228, 233, .8);
  backdrop-filter: blur(16px);
}

.app-header:has(.icon-button[hidden]) { grid-template-columns: 1fr auto; }

.brand-button {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  min-height: 44px;
  padding: 0;
  color: var(--ink);
  background: transparent;
  border: 0;
  font-family: "Zen Maru Gothic", sans-serif;
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
}

.brand-mark {
  display: grid;
  width: 34px;
  height: 34px;
  place-items: center;
  color: white;
  background: linear-gradient(145deg, var(--pink), var(--pink-deep));
  border-radius: 12px 12px 12px 5px;
  box-shadow: 0 8px 18px rgba(244, 80, 130, .28);
  font-size: 18px;
  font-weight: 800;
}

.icon-button {
  width: 44px;
  height: 44px;
  padding: 0;
  color: var(--ink);
  background: white;
  border: 1px solid var(--line);
  border-radius: 50%;
  box-shadow: var(--soft-shadow);
  font-size: 32px;
  line-height: 1;
  cursor: pointer;
}

.global-progress {
  position: sticky;
  z-index: 21;
  top: 66px;
  height: 4px;
  overflow: hidden;
  background: #f2e9ed;
}

.global-progress-bar {
  width: 0;
  height: 100%;
  background: linear-gradient(90deg, var(--pink), var(--pink-deep));
  border-radius: 0 99px 99px 0;
  transition: width .35s ease;
}

.app {
  min-height: calc(100svh - 66px);
}

.screen {
  display: flex;
  min-height: calc(100svh - 66px);
  flex-direction: column;
  padding: 28px 22px calc(24px + env(safe-area-inset-bottom));
  animation: screen-in .35s ease both;
}

.screen.with-progress { min-height: calc(100svh - 70px); }

@keyframes screen-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.eyebrow {
  margin: 0 0 9px;
  color: var(--pink-dark);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
}

h1, h2, h3, p { margin-top: 0; }

h1, h2, h3 {
  font-family: "Zen Maru Gothic", "M PLUS Rounded 1c", sans-serif;
  letter-spacing: -.02em;
}

h1 {
  margin-bottom: 14px;
  font-size: clamp(34px, 10vw, 44px);
  line-height: 1.22;
}

h2 {
  margin-bottom: 12px;
  font-size: 28px;
  line-height: 1.35;
}

h3 { margin-bottom: 8px; font-size: 18px; }

.lead {
  color: #655c68;
  font-size: 16px;
  line-height: 1.8;
}

.highlight {
  color: var(--pink-deep);
  background: linear-gradient(transparent 64%, #ffd7e3 0);
}

.hero-screen {
  padding-top: 20px;
  background:
    radial-gradient(circle at 90% 4%, rgba(255, 160, 188, .32), transparent 15rem),
    var(--canvas);
}

.hero-visual {
  position: relative;
  height: 285px;
  margin: 12px 0 24px;
}

.hero-photo {
  position: absolute;
  inset: 0 28px 0 0;
  width: calc(100% - 28px);
  height: 100%;
  object-fit: cover;
  object-position: center 34%;
  border: 8px solid white;
  border-radius: 36px 90px 36px 36px;
  box-shadow: 0 20px 42px rgba(90, 45, 61, .18);
}

.match-pill {
  position: absolute;
  right: 0;
  bottom: 23px;
  display: grid;
  width: 104px;
  height: 104px;
  place-items: center;
  color: white;
  background: linear-gradient(145deg, var(--pink), var(--pink-deep));
  border: 7px solid var(--canvas);
  border-radius: 50%;
  box-shadow: 0 12px 32px rgba(244, 80, 130, .3);
  text-align: center;
  transform: rotate(4deg);
}

.match-pill strong { display: block; font-size: 27px; line-height: 1; }
.match-pill span { font-size: 11px; font-weight: 800; }

.floating-note {
  position: absolute;
  top: 15px;
  left: -5px;
  padding: 9px 13px;
  color: var(--ink);
  background: white;
  border-radius: 14px 14px 14px 5px;
  box-shadow: var(--soft-shadow);
  font-size: 12px;
  font-weight: 800;
}

.flow-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 0 0 22px;
}

.flow-step {
  padding: 13px 7px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 18px;
  text-align: center;
  box-shadow: 0 7px 18px rgba(111, 73, 87, .05);
}

.flow-step b { display: block; margin-bottom: 3px; color: var(--pink-deep); font-size: 18px; }
.flow-step span { font-size: 11px; font-weight: 700; }

.button-stack { display: grid; gap: 10px; margin-top: auto; padding-top: 20px; }

.primary-button,
.secondary-button {
  display: inline-flex;
  min-height: 54px;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 13px 18px;
  border-radius: 18px;
  font-weight: 800;
  cursor: pointer;
  transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
}

.primary-button {
  color: white;
  background: linear-gradient(135deg, var(--pink), var(--pink-deep));
  border: 0;
  box-shadow: 0 13px 28px rgba(244, 80, 130, .28);
}

.secondary-button {
  color: var(--ink);
  background: white;
  border: 1px solid var(--line);
  box-shadow: var(--soft-shadow);
}

.primary-button:active,
.secondary-button:active { transform: translateY(2px) scale(.99); }

.primary-button:disabled {
  color: #aaa1a6;
  background: #eae3e6;
  box-shadow: none;
  cursor: not-allowed;
}

.notice-card,
.info-card,
.option-card,
.score-card,
.shelter-card,
.timeline {
  background: white;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--soft-shadow);
}

.notice-card { padding: 17px; margin: 6px 0 18px; }

.notice-card p { margin-bottom: 0; color: var(--muted); font-size: 13px; line-height: 1.7; }

.check-list { display: grid; gap: 11px; margin: 8px 0; }

.check-row {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 12px;
  align-items: start;
  padding: 16px;
  background: white;
  border: 1.5px solid var(--line);
  border-radius: 19px;
  box-shadow: 0 6px 18px rgba(110, 70, 85, .05);
  cursor: pointer;
}

.check-row:has(input:checked) {
  background: #fff7fa;
  border-color: #ffadc4;
}

.check-row input {
  width: 24px;
  height: 24px;
  margin: 1px 0 0;
  accent-color: var(--pink-deep);
}

.check-row strong { display: block; margin-bottom: 4px; font-size: 15px; line-height: 1.55; }
.check-row small { display: block; color: var(--muted); font-size: 12px; line-height: 1.55; }

.step-count {
  display: flex;
  justify-content: space-between;
  margin-bottom: 18px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
}

.question-visual {
  display: grid;
  width: 78px;
  height: 78px;
  margin: 6px 0 18px;
  place-items: center;
  color: var(--pink-deep);
  background: linear-gradient(145deg, #fff, var(--blush));
  border: 1px solid #f7d6e1;
  border-radius: 27px 27px 27px 8px;
  box-shadow: var(--soft-shadow);
  font-size: 30px;
}

.question-help { margin-bottom: 24px; color: var(--muted); line-height: 1.7; }

.range-card { padding: 21px; background: white; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--soft-shadow); }

.range-value { display: flex; align-items: baseline; justify-content: center; margin: 4px 0 18px; color: var(--pink-deep); }
.range-value strong { font-size: 48px; line-height: 1; }
.range-value span { margin-left: 5px; font-weight: 800; }

input[type="range"] {
  width: 100%;
  height: 8px;
  appearance: none;
  background: linear-gradient(90deg, var(--pink) var(--range-progress, 50%), #eee6e9 var(--range-progress, 50%));
  border-radius: 999px;
  outline: none;
}

input[type="range"]::-webkit-slider-thumb {
  width: 28px;
  height: 28px;
  appearance: none;
  background: white;
  border: 7px solid var(--pink-deep);
  border-radius: 50%;
  box-shadow: 0 5px 14px rgba(244, 80, 130, .28);
}

.range-labels { display: flex; justify-content: space-between; margin-top: 13px; color: var(--muted); font-size: 11px; }

.option-grid { display: grid; gap: 11px; }

.option-card {
  display: grid;
  grid-template-columns: 44px 1fr 24px;
  gap: 13px;
  align-items: center;
  width: 100%;
  min-height: 76px;
  padding: 14px 16px;
  color: var(--ink);
  text-align: left;
  cursor: pointer;
}

.option-card.selected {
  background: #fff4f8;
  border-color: #ffa6c0;
  box-shadow: 0 9px 26px rgba(244, 80, 130, .12);
}

.option-symbol { display: grid; width: 44px; height: 44px; place-items: center; background: var(--blush); border-radius: 15px; font-size: 21px; }
.option-card b { display: block; margin-bottom: 3px; font-size: 15px; }
.option-card small { display: block; color: var(--muted); font-size: 11px; }
.choice-dot { width: 21px; height: 21px; border: 2px solid #d6cbd0; border-radius: 50%; }
.option-card.selected .choice-dot { border: 6px solid var(--pink-deep); }

.loading-screen { align-items: center; justify-content: center; text-align: center; }

.loading-orbit {
  position: relative;
  width: 148px;
  height: 148px;
  margin-bottom: 28px;
  background: radial-gradient(circle, white 0 43%, transparent 44%);
  border: 2px dashed #f5a0ba;
  border-radius: 50%;
  animation: orbit 8s linear infinite;
}

.loading-orbit::before,
.loading-orbit::after {
  position: absolute;
  display: grid;
  width: 48px;
  height: 48px;
  place-items: center;
  color: white;
  background: var(--pink-deep);
  border: 5px solid var(--canvas);
  border-radius: 18px 18px 18px 6px;
  font-weight: 800;
  content: "P";
}

.loading-orbit::before { top: -16px; left: 48px; }
.loading-orbit::after { right: -7px; bottom: 6px; content: "♡"; background: var(--blue); }

@keyframes orbit { to { transform: rotate(360deg); } }
.loading-orbit span { position: absolute; inset: 0; display: grid; place-items: center; color: var(--pink-deep); font-size: 28px; font-weight: 800; animation: counter-orbit 8s linear infinite; }
@keyframes counter-orbit { to { transform: rotate(-360deg); } }

.profile-hero { position: relative; margin: -6px -4px 20px; }
.profile-photo { width: 100%; height: 330px; object-fit: cover; object-position: center 32%; border-radius: 32px; box-shadow: 0 18px 42px rgba(84, 52, 63, .18); }
.profile-badge { position: absolute; right: 14px; bottom: 14px; padding: 10px 13px; color: white; background: rgba(56, 47, 60, .8); border-radius: 14px; backdrop-filter: blur(8px); font-size: 12px; font-weight: 800; }

.pet-title { display: flex; align-items: end; justify-content: space-between; gap: 12px; }
.pet-title h1 { margin-bottom: 4px; }
.pet-meta { color: var(--muted); font-size: 13px; font-weight: 700; }

.tag-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 18px; }
.tag { padding: 8px 11px; color: #6d4660; background: var(--blush); border-radius: 999px; font-size: 12px; font-weight: 800; }

.trait-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.trait-card { padding: 16px; background: white; border: 1px solid var(--line); border-radius: 20px; }
.trait-card span { display: block; margin-bottom: 7px; color: var(--pink-dark); font-size: 11px; font-weight: 800; }
.trait-card p { margin: 0; font-size: 13px; line-height: 1.6; }

.score-card { display: grid; grid-template-columns: 122px 1fr; gap: 16px; align-items: center; padding: 18px; margin: 5px 0 18px; }
.score-ring { --score: 91; display: grid; width: 116px; height: 116px; place-items: center; background: conic-gradient(var(--pink-deep) calc(var(--score) * 1%), #f2e7eb 0); border-radius: 50%; }
.score-inner { display: grid; width: 88px; height: 88px; place-items: center; background: white; border-radius: 50%; text-align: center; }
.score-inner strong { display: block; color: var(--pink-deep); font-size: 29px; line-height: 1; }
.score-inner small { color: var(--muted); font-size: 10px; font-weight: 700; }
.score-message strong { display: block; margin-bottom: 7px; font-size: 17px; line-height: 1.5; }
.score-message p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }

.axis-list { display: grid; gap: 13px; margin: 4px 0 20px; }
.axis-header { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 12px; font-weight: 800; }
.axis-track { height: 9px; overflow: hidden; background: #eee7ea; border-radius: 99px; }
.axis-fill { height: 100%; background: linear-gradient(90deg, var(--pink), var(--pink-deep)); border-radius: 99px; }
.axis-item:nth-child(2) .axis-fill { background: linear-gradient(90deg, #7fcdf8, var(--blue)); }
.axis-item:nth-child(3) .axis-fill { background: linear-gradient(90deg, #79d8ac, var(--mint)); }
.axis-item:nth-child(4) .axis-fill { background: linear-gradient(90deg, #b6a5ed, var(--lavender)); }
.axis-item:nth-child(5) .axis-fill { background: linear-gradient(90deg, #ffc86d, var(--amber)); }

.reason-list { display: grid; gap: 10px; }
.reason { display: grid; grid-template-columns: 36px 1fr; gap: 12px; padding: 14px; background: white; border: 1px solid var(--line); border-radius: 18px; }
.reason-number { display: grid; width: 36px; height: 36px; place-items: center; color: var(--pink-deep); background: var(--blush); border-radius: 13px; font-size: 13px; font-weight: 800; }
.reason p { margin: 0; font-size: 13px; line-height: 1.65; }

.timeline { position: relative; padding: 18px; margin-top: 6px; }
.timeline::before { position: absolute; top: 29px; bottom: 29px; left: 57px; width: 2px; background: #f4ccd8; content: ""; }
.timeline-item { position: relative; display: grid; grid-template-columns: 52px 1fr; gap: 15px; min-height: 72px; }
.timeline-item:last-child { min-height: 0; }
.timeline-time { color: var(--pink-dark); font-size: 12px; font-weight: 800; }
.timeline-content { position: relative; padding: 0 0 17px 16px; }
.timeline-content::before { position: absolute; top: 3px; left: -20px; width: 12px; height: 12px; background: var(--pink-deep); border: 4px solid white; border-radius: 50%; box-shadow: 0 0 0 2px #f4ccd8; content: ""; }
.timeline-content b { display: block; margin-bottom: 3px; font-size: 14px; }
.timeline-content p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; }

.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
.info-card { padding: 15px; }
.info-card span { display: block; margin-bottom: 5px; color: var(--muted); font-size: 10px; font-weight: 800; }
.info-card strong { display: block; font-size: 13px; line-height: 1.5; }

.shelter-card { padding: 20px; }
.shelter-logo { display: grid; width: 52px; height: 52px; margin-bottom: 14px; place-items: center; color: white; background: linear-gradient(145deg, var(--blue), #4aa7e5); border-radius: 18px 18px 18px 6px; font-size: 23px; }
.shelter-card p { color: var(--muted); font-size: 13px; line-height: 1.7; }
.sample-note { padding: 12px 14px; color: #6f6872; background: #f7f2f4; border-radius: 14px; font-size: 11px; line-height: 1.55; }

.complete-screen { align-items: center; text-align: center; }
.complete-mark { display: grid; width: 112px; height: 112px; margin: 32px auto 24px; place-items: center; color: white; background: linear-gradient(145deg, var(--pink), var(--pink-deep)); border: 9px solid #ffe6ee; border-radius: 40px 40px 40px 13px; box-shadow: 0 20px 42px rgba(244, 80, 130, .28); font-size: 48px; transform: rotate(-4deg); }
.complete-card { width: 100%; padding: 18px; margin: 12px 0; background: white; border: 1px solid var(--line); border-radius: 22px; text-align: left; }
.complete-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
.complete-row:last-child { border: 0; }
.complete-row span { color: var(--muted); }
.complete-row strong { text-align: right; }

.screen-footer-note { margin: 12px 0 0; color: var(--muted); font-size: 10px; line-height: 1.6; text-align: center; }

@media (min-width: 700px) {
  body { padding: 24px 0; }
  .app-shell { min-height: calc(100vh - 48px); min-height: calc(100svh - 48px); border: 1px solid rgba(255,255,255,.8); border-radius: 34px; }
  .app { min-height: calc(100svh - 114px); }
  .screen { min-height: calc(100svh - 114px); }
  .screen.with-progress { min-height: calc(100svh - 118px); }
}

@media (max-width: 360px) {
  .screen { padding-right: 17px; padding-left: 17px; }
  h1 { font-size: 32px; }
  h2 { font-size: 25px; }
  .hero-visual { height: 250px; }
  .score-card { grid-template-columns: 105px 1fr; padding: 14px; }
  .score-ring { width: 100px; height: 100px; }
  .score-inner { width: 76px; height: 76px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* Original Petton identity + responsive promotion */
.brand-mark {
  display: block;
  width: 36px;
  height: 36px;
  object-fit: cover;
  border-radius: 11px;
  box-shadow: 0 8px 18px rgba(244, 80, 130, .2);
}

.brand-button > span:last-child {
  background: linear-gradient(90deg, var(--blue), var(--pink));
  background-clip: text;
  color: transparent;
  font-family: "Fredoka", "Zen Maru Gothic", sans-serif;
  font-size: 23px;
  font-weight: 600;
}

.opening-screen {
  position: relative;
  max-width: none;
  min-height: 100vh;
  min-height: 100svh;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background:
    radial-gradient(circle at 12% 18%, rgba(255, 207, 223, .9), transparent 34%),
    radial-gradient(circle at 88% 22%, rgba(189, 225, 255, .9), transparent 36%),
    radial-gradient(circle at 48% 92%, rgba(225, 212, 255, .72), transparent 38%),
    linear-gradient(135deg, #fff3f8 0%, #f5efff 48%, #edf8ff 100%);
}

.opening-content {
  position: relative;
  z-index: 2;
  display: flex;
  width: min(100%, 460px);
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.opening-app-icon {
  width: clamp(132px, 34vw, 192px);
  aspect-ratio: 1;
  margin-bottom: 20px;
  object-fit: cover;
  border-radius: 28%;

/* ---------------- Scoring ---------------- */

function petTypeScore() {
  const { activeHours, aloneHours, livingSpace, household, holidayStyle, groomingTime, petExperience } = state.answers;
  let dog = 50, cat = 50;
  dog += (activeHours - 1.5) * 9;
  cat += (1.5 - activeHours) * 5;
  dog += (7 - aloneHours) * 2.4;
  cat += (aloneHours - 5) * 2.2;
  dog += livingSpace === '一戸建て' ? 9 : -3;
  cat += livingSpace === '一戸建て' ? -1 : 4;
  dog += household === 'にぎやかなことが多い' ? 6 : -3;
  cat += household === 'にぎやかなことが多い' ? -4 : 5;
  dog += holidayStyle === 'アクティブ派' ? 8 : -3;
  cat += holidayStyle === 'のんびり派' ? 5 : -2;
  dog += groomingTime === '毎日たっぷり時間をかけられる' ? 6 : groomingTime === 'できるだけ手短にしたい' ? -6 : 0;
  cat += groomingTime === 'できるだけ手短にしたい' ? 5 : 0;
  dog += petExperience === '経験あり' ? 3 : -2;
  dog = clamp(Math.round(dog), 18, 98);
  cat = clamp(Math.round(cat), 18, 98);
  let judgement = 'どちらとも相性良好';
  if (dog - cat >= 14) judgement = '犬向き';
  else if (cat - dog >= 14) judgement = '猫向き';
  return { dog, cat, judgement };
}

function candidateScore(pet) {
  const { homeHours, activeHours, togetherTime, holidayStyle, livingSpace, household, aloneHours, groomingTime } = state.answers;
  const alone = clamp(Math.round(100 - Math.abs(aloneHours - pet.aloneTolerance) * 7.5), 38, 99);
  const active = clamp(Math.round(100 - Math.abs(activeHours * 2.3 - pet.energy) * 10.5), 40, 99);
  const home = clamp(Math.round(58 + homeHours * 2 + (togetherTime === '夜' ? 6 : togetherTime === '朝' ? 4 : 2) - (pet.sociability >= 4 && homeHours < 4 ? 10 : 0)), 42, 99);
  const spaceBonus = livingSpace === '一戸建て' ? (pet.size.startsWith('大型') ? 15 : 5) : (pet.size.startsWith('大型') ? -14 : 3);
  const noiseBonus = household === 'にぎやかなことが多い' ? (pet.sociability - 3) * 5 : (3 - pet.sociability) * 5;
  const space = clamp(Math.round(76 + spaceBonus + noiseBonus), 38, 99);
  const groomBonus = groomingTime === '毎日たっぷり時間をかけられる' ? pet.careLevel * 4 : groomingTime === 'できるだけ手短にしたい' ? (2 - pet.careLevel) * 6 : 2;
  const values = clamp(Math.round(70 + (holidayStyle === 'アクティブ派' ? (pet.energy - 3) * 8 : (3 - pet.energy) * 8) + groomBonus), 40, 99);
  const overall = Math.round((alone + active + home + space + values) / 5);
  return { overall, axes: { alone, active, home, space, values } };
}

function candidateReasons(pet) {
  const { activeHours, aloneHours, holidayStyle } = state.answers;
  const lines = [];
  lines.push(aloneHours <= pet.aloneTolerance
    ? `お留守番は${aloneHours}時間ほど。${pet.name}が安心して待てる範囲です。`
    : `お留守番が${aloneHours}時間になる日は、慣らし期間や見守りグッズを団体と相談すると安心です。`);
  lines.push(pet.kind === 'dog'
    ? (activeHours >= pet.energy / 2.3 ? `1日${activeHours}時間の運動時間は、${pet.name}の元気を発散させるのにちょうど良さそうです。` : `運動時間は${activeHours}時間。${pet.name}には少し短めのペースなので、散歩を数回に分けると安心です。`)
    : (activeHours >= 0.5 ? `${activeHours}時間ほどの遊び時間があれば、${pet.name}との室内遊びを楽しめます。` : `忙しい日でも、短いふれあいの時間を意識すると${pet.name}との距離が縮まります。`));
  lines.push(holidayStyle === 'のんびり派' && pet.energy <= 3
    ? `休日をゆったり過ごす価値観が、${pet.name}の落ち着いた性格に合っています。`
    : holidayStyle === 'アクティブ派' && pet.energy >= 4
      ? `アクティブに過ごす休日は、${pet.name}の好奇心や体力とよく合います。`
      : `休日の過ごし方と${pet.name}の性格は、少しずつすり合わせていくとよさそうです。`);
  return lines;
}

function matchedCandidates() {
  return PETS.map((pet) => ({ pet, score: candidateScore(pet) })).sort((a, b) => b.score.overall - a.score.overall);
}

function selectedPetEntry() {
  const list = matchedCandidates();
  const found = list.find((entry) => entry.pet.id === state.selectedPetId);
  return found || list[0];
}

/* ---------------- Life & cost simulation ---------------- */

const LIFESTYLES = ['学生', '一人暮らし社会人', '夫婦・同棲', '子育て家族'];

function lifeSimTimeline(pet) {
  const { activeHours, aloneHours, togetherTime, holidayStyle } = state.answers;
  const lifestyle = state.lifestyle || state.answers.familyStyle;
  const morning = pet.kind === 'cat'
    ? ['朝ごはんとトイレ掃除', `${pet.name}の食欲や体調を確認しながら、トイレもきれいにします。`]
    : ['朝の散歩とごはん', activeHours >= 1.5 ? '少し長めのコースで、気持ちよく一日をスタート。' : '短めのコースをゆっくりと。無理のないペースで続けます。'];
  const daytimeLabel = lifestyle === '学生' ? '登校中のお留守番'
    : lifestyle === '子育て家族' ? '在宅の家族が交代で見守り'
      : lifestyle === '夫婦・同棲' ? 'ふたりで交代しながら見守り'
        : 'ひとりでお留守番';
  const daytimeDetail = aloneHours <= pet.aloneTolerance
    ? `${aloneHours}時間ほどの留守番も、${pet.name}なら落ち着いて待てそうです。`
    : `留守番が${aloneHours}時間になるため、慣らし期間や見守りカメラの活用を検討すると安心です。`;
  const evening = ['帰宅後のふれあい', `「${togetherTime}」の時間を中心に、${pet.name}とのコミュニケーションを楽しみます。`];
  const night = holidayStyle === 'のんびり派'
    ? ['同じ部屋でゆったり', `${pet.name}のペースに合わせて、静かな夜を過ごします。`]
    : ['明日に向けて軽く運動', `${pet.name}と一緒に、気分転換の時間をつくります。`];

  const items = [
    ['7:30', morning[0], morning[1]],
    [lifestyle === '学生' ? '9:00' : '9:30', daytimeLabel, daytimeDetail],
    ['18:00', evening[0], evening[1]],
    ['21:30', night[0], night[1]]
  ];
  if (lifestyle === '子育て家族') {
    items.splice(2, 0, ['15:30', '子どもと一緒にお世話', `${pet.name}と子どもが安全に関われるよう、はじめは大人が見守ります。`]);
  }
  if (lifestyle === '夫婦・同棲') {
    items[1] = ['12:30', 'ふたりで交代しながら見守り', `${aloneHours}時間の留守番も、ふたりで分担すれば${pet.name}も安心です。`];
  }
  return items;
}

function lifestyleNote(lifestyle, pet) {
  const notes = {
    '学生': `授業や部活で家を空ける時間がある分、${pet.name}が安心して待てる工夫（留守番の慣らしや見守りグッズ）を早めに準備しておくと安心です。`,
    '一人暮らし社会人': `日中は仕事で不在になりやすいため、${pet.name}の留守番時間と体力に合わせて、朝夜のふれあい時間を大切にする暮らしになります。`,

  };
  return notes[lifestyle] || notes['一人暮らし社会人'];
}

function costTotals(pet) {
  const initialTotal = pet.initialCosts.reduce((sum, [, amount]) => sum + amount, 0);
  const monthlyTotal = pet.monthlyCosts.reduce((sum, [, amount]) => sum + amount, 0);
  const annualExtraTotal = pet.annualExtras.reduce((sum, [, amount]) => sum + amount, 0);
  const annualTotal = monthlyTotal * 12 + annualExtraTotal;
  return { initialTotal, monthlyTotal, annualExtraTotal, annualTotal };
}

/* ---------------- Navigation ---------------- */

function setProgress() {
  const index = screens.indexOf(state.screen);
  const show = !['opening', 'intro'].includes(state.screen);
  globalProgress.hidden = !show;
  const questionExtra = state.screen === 'diagnosis' ? state.question / TOTAL_QUESTIONS : 0;
  const width = clamp(((index + questionExtra) / (screens.length - 1)) * 100, 2, 100);
  globalProgressBar.style.width = `${width}%`;
}

function navigate(screen, { push = true } = {}) {
  if (push && state.screen !== screen) state.history.push({ screen: state.screen, question: state.question });
  state.screen = screen;
  if (screen !== 'diagnosis') state.question = 0;
  if (screen === 'lifesim' && !state.lifestyle) state.lifestyle = state.answers.familyStyle;
  history.replaceState(null, '', `#${screen}`);
  render();
  document.querySelector('.app-shell').scrollTo({ top: 0, behavior: 'smooth' });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goBack() {
  if (state.screen === 'diagnosis' && state.question > 0) {
    state.question -= 1;
    render();
    return;
  }
  const previous = state.history.pop();
  if (previous) {
    state.screen = previous.screen;
    state.question = previous.question;
    history.replaceState(null, '', `#${state.screen}`);
    render();
  } else {
    navigate('intro', { push: false });
  }
}

function screenClass(extra = '') {
  return `screen${['opening', 'intro'].includes(state.screen) ? '' : ' with-progress'}${extra ? ` ${extra}` : ''}`;
}

function diagnosisTemplate() {
  const q = QUESTIONS[state.question];
  const value = state.answers[q.key];
  let content = '';
  if (q.type === 'range') {
    content = `
      <div class="question-visual" aria-hidden="true">${q.icon}</div>
      <h2>${q.title}</h2>
      <p class="question-help">${q.help}</p>
      <div class="range-card">
        <div class="range-value"><strong id="rangeValue">${value}</strong><span>時間</span></div>
        <input id="rangeInput" data-range="${q.key}" type="range" min="${q.min}" max="${q.max}" step="${q.step}" value="${value}" aria-label="${q.title.replace(/<br>/g, '')}" />
        <div class="range-labels"><span>${q.labels[0]}</span><span>${q.labels[1]}</span></div>
      </div>`;
  } else {
    content = `
      <div class="question-visual" aria-hidden="true">${q.icon}</div>
      <h2>${q.title}</h2>
      <p class="question-help">${q.help}</p>
      <div class="option-grid">
        ${q.options.map(([val, title, detail, symbol]) => `<button class="option-card ${value === val ? 'selected' : ''}" data-answer="${q.key}" data-value="${val}"><span class="option-symbol">${symbol}</span><span><b>${title}</b><small>${detail}</small></span><span class="choice-dot"></span></button>`).join('')}
      </div>`;
  }
  return `
    <section class="${screenClass()}">
      <div class="step-count"><span>DIAGNOSIS</span><span>${state.question + 1} / ${TOTAL_QUESTIONS}</span></div>
      ${content}
      <div class="button-stack">
        <button class="primary-button" data-action="question-next" ${q.type === 'option' && !value ? 'disabled' : ''}>${state.question === TOTAL_QUESTIONS - 1 ? '回答を重ねて診断する' : '次の質問へ'} <span aria-hidden="true">→</span></button>
      </div>

}

          <div class="info-card"><span>面談できる時間</span><strong>土日祝<br>11:00–16:00</strong></div>
          <div class="info-card"><span>アクセス</span><strong>駅から徒歩8分<br>駐車場あり</strong></div>
        </div>
        <div class="sample-note">これは発表用のサンプル団体です。実在の団体情報・連絡先ではありません。現時点では、提携団体への接続を予定している段階で、実際の送信は行われません。</div>
      </div>
      <div class="button-stack"><button class="primary-button" data-action="to-responsibility">内容を確認して次へ進む</button></div>
    </section>`;
}

function responsibilityTemplate() {
  const labels = [
    ['最後まで責任を持って飼います', '生活環境が変わった場合も、まず団体へ相談します。'],
    ['必要な費用を理解しています', '食費・医療費・予防・用品などが継続的に必要です。'],
    ['安易な理由で飼育を放棄しません', '困ったときは一人で抱えず、家族や団体に相談します。'],
    ['一緒に暮らす人と相談しました', '家族や同居人の理解・協力を確認します。']
  ];
  return `
    <section class="${screenClass()}">
      <p class="eyebrow">最後に</p>
      <h2>かわいいの先にある<br>責任を確認します</h2>
      <p class="lead">出会いをゴールにせず、その後の暮らしまで大切にするための確認です。</p>
      <div class="check-list">
        ${labels.map(([title, detail], i) => `<label class="check-row"><input type="checkbox" data-consent="final" data-index="${i}" ${state.finalConsent[i] ? 'checked' : ''} /><span><strong>${title}</strong><small>${detail}</small></span></label>`).join('')}
      </div>
      <div class="button-stack"><button class="primary-button" data-action="finish" ${state.finalConsent.every(Boolean) ? '' : 'disabled'}>問い合わせ内容を確認する</button></div>
      <p class="screen-footer-note">現在、実際の問い合わせは送信されません。</p>
    </section>`;
}

function completeTemplate() {
  const { pet, score } = selectedPetEntry();
  const lifestyle = state.lifestyle || state.answers.familyStyle;
  const totals = costTotals(pet);
  return `
    <section class="${screenClass('complete-screen')}">
      <div class="complete-mark" aria-hidden="true">✓</div>
      <p class="eyebrow">CHECK COMPLETE</p>
      <h2>${pet.name}との暮らしを<br>考える準備ができました</h2>
      <p class="lead">次は保護団体のスタッフと、実際の様子を一緒に確かめます。</p>
      <div class="complete-card">
        <div class="complete-row"><span>お相手</span><strong>${pet.name}・${pet.age}</strong></div>
        <div class="complete-row"><span>相性スコア</span><strong>${score.overall}%</strong></div>
        <div class="complete-row"><span>暮らしのタイプ</span><strong>${lifestyle}</strong></div>
        <div class="complete-row"><span>月額費用の目安</span><strong>約${yen(totals.monthlyTotal)}</strong></div>
        <div class="complete-row"><span>次のステップ</span><strong>団体との面談</strong></div>
      </div>
      <div class="sample-note">現在、問い合わせは送信していません。</div>
      <div class="button-stack" style="width:100%"><button class="primary-button" data-action="restart">もう一度診断する</button><button class="secondary-button" data-action="home">最初の画面へ</button></div>
    </section>`;
}

/* ---------------- Render ---------------- */

function render() {
  appHeader.hidden = state.screen === 'opening';
  backButton.hidden = state.screen === 'opening' || state.screen === 'complete' || state.screen === 'loading';
  setProgress();
  const templates = {
    opening: openingTemplate,
    intro: introTemplate,
    diagnosis: diagnosisTemplate,
    loading: loadingTemplate,
    pettype: pettypeTemplate,
    matching: matchingTemplate,
    profile: profileTemplate,
    lifesim: lifesimTemplate,
    cost: costTemplate,
    contact: contactTemplate,
    responsibility: responsibilityTemplate,
    complete: completeTemplate
  };
  app.innerHTML = templates[state.screen]();
  bindEvents();
  if (state.screen === 'diagnosis') updateRangeFill();
  if (state.screen === 'loading') {
    window.setTimeout(() => {
      if (state.screen === 'loading') navigate('pettype', { push: false });
    }, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 150 : 1200);
  }
}

function updateRangeFill() {
  const range = app.querySelector('input[type="range"]');
  if (!range) return;
  const progress = ((Number(range.value) - Number(range.min)) / (Number(range.max) - Number(range.min))) * 100;
  range.style.setProperty('--range-progress', `${progress}%`);
}

function bindEvents() {
  app.querySelectorAll('[data-action]').forEach((button) => {
    button.addEventListener('click', () => {
      const action = button.dataset.action;
      if (action === 'start') navigate('intro');
      if (action === 'promo-start') document.querySelector('#diagnosisConsent')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      if (action === 'scroll-how') document.querySelector('#howItWorks')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      if (action === 'consent-next') navigate('diagnosis');
      if (action === 'question-next') {
        if (state.question < TOTAL_QUESTIONS - 1) {
          state.question += 1;
          render();
        } else {
          navigate('loading');
        }
      }
      if (action === 'to-matching') navigate('matching');
      if (action === 'select-pet') {
        state.selectedPetId = button.dataset.petId;
        navigate('profile');
      }
      if (action === 'to-lifesim') navigate('lifesim');
      if (action === 'to-cost') navigate('cost');
      if (action === 'to-contact') navigate('contact');
      if (action === 'to-responsibility') navigate('responsibility');
      if (action === 'finish') navigate('complete');
      if (action === 'home') navigate('opening', { push: false });
      if (action === 'restart') {
        state.history = [];
        state.question = 0;
        state.selectedPetId = null;
        state.lifestyle = null;
        state.costTab = 'initial';
        state.introConsent = [true, true, true];
        state.finalConsent = [false, false, false, false];
        navigate('diagnosis', { push: false });
      }
    });
  });

  app.querySelectorAll('input[data-consent]').forEach((input) => {
    input.addEventListener('change', () => {
      const target = input.dataset.consent === 'intro' ? state.introConsent : state.finalConsent;
      target[Number(input.dataset.index)] = input.checked;
      const action = input.dataset.consent === 'intro' ? 'consent-next' : 'finish';
      const nextButton = app.querySelector(`[data-action="${action}"]`);
      if (nextButton) nextButton.disabled = !target.every(Boolean);
    });
  });

  app.querySelectorAll('[data-answer]').forEach((button) => {
    button.addEventListener('click', () => {
      state.answers[button.dataset.answer] = button.dataset.value;
      render();
    });
  });

  app.querySelectorAll('[data-lifestyle]').forEach((button) => {
    button.addEventListener('click', () => {
      state.lifestyle = button.dataset.lifestyle;
      render();
    });
  });

  app.querySelectorAll('[data-costtab]').forEach((button) => {
    button.addEventListener('click', () => {
      state.costTab = button.dataset.costtab;
      render();
    });
  });

  app.querySelectorAll('[data-contact]').forEach((field) => {
    field.addEventListener('input', () => {
      state.contact[field.dataset.contact] = field.value;
    });
  });

  const rangeInput = app.querySelector('[data-range]');
  if (rangeInput) rangeInput.addEventListener('input', () => {
    const key = rangeInput.dataset.range;
    state.answers[key] = Number(rangeInput.value);
    app.querySelector('#rangeValue').textContent = rangeInput.value;
    updateRangeFill();
  });
}

backButton.addEventListener('click', goBack);
brandButton.addEventListener('click', () => navigate('opening', { push: false }));
render();

    </script>
  </body>
</html>
